name: piplan_smart_city
description: Piplan Smart City Flutter Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6

  # API
  http: ^1.6.0

  url_launcher: ^6.3.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.3

  # Images
